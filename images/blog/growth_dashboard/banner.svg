<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="50%" stop-color="#181b20"/>
      <stop offset="100%" stop-color="#121315"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e07a5f"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#39ff14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Orbital Ring Grid -->
  <circle cx="600" cy="315" r="280" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="600" cy="315" r="180" fill="none" stroke="rgba(224,122,95,0.12)" stroke-width="2"/>
  <circle cx="600" cy="315" r="90" fill="none" stroke="rgba(57,255,20,0.08)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Grid lines -->
  <line x1="200" y1="460" x2="1000" y2="460" stroke="#36393e" stroke-width="1.5"/>
  <line x1="200" y1="170" x2="200" y2="460" stroke="#36393e" stroke-width="1.5"/>

  <!-- Solow-Swan Production Curve (Coral) -->
  <path d="M 200 460 Q 380 230 650 250 T 1000 270" fill="none" stroke="url(#coralGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Nominal Phillips / Inflation Curve (Green) -->
  <path d="M 200 260 Q 450 360 700 410 T 1000 440" fill="none" stroke="url(#greenGrad)" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Equilibrium Node -->
  <circle cx="560" cy="275" r="9" fill="#f97316" stroke="#fff" stroke-width="3"/>
  <circle cx="560" cy="275" r="22" fill="none" stroke="rgba(249,115,22,0.4)" stroke-width="2">
    <animate attributeName="r" values="16;28;16" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Typography & Badges -->
  <rect x="70" y="60" width="220" height="34" rx="6" fill="rgba(224,122,95,0.15)" stroke="rgba(224,122,95,0.5)"/>
  <text x="85" y="82" fill="#e07a5f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PYODIDE WASM ENGINE</text>

  <text x="70" y="145" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800">Macroeconomic Growth Engine</text>
  <text x="70" y="185" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">Dynamic Equilibrium, Shock Propagation &amp; Historical Crises</text>

  <!-- Legend Badges -->
  <rect x="780" y="70" width="160" height="30" rx="4" fill="rgba(0,0,0,0.5)" stroke="#333"/>
  <circle cx="800" cy="85" r="5" fill="#e07a5f"/>
  <text x="815" y="89" fill="#d1d5db" font-family="sans-serif" font-size="12">Real Output (y)</text>

  <rect x="960" y="70" width="170" height="30" rx="4" fill="rgba(0,0,0,0.5)" stroke="#333"/>
  <circle cx="980" cy="85" r="5" fill="#39ff14"/>
  <text x="995" y="89" fill="#d1d5db" font-family="sans-serif" font-size="12">Inflation Rate (π)</text>
</svg>
